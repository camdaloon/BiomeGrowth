enabled: true

# Format: -<plantname> <biomename> <speed>
# Speed is a relative growth-speed value. Higher = faster.
# 5 = Slow, 20 = Normal, 50 = Fast.
# Any positive whole number can be used, not just the tab-completion presets.
# The default config includes every supported seed/crop type in every Overworld biome at 20.
