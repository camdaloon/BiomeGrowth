plugins {
    id 'java'
}

group = 'me.camdaloon'
version = '1.0.0'

repositories {
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    // Compile against 1.21.11 so the same Java 21 bytecode can run on
    // 1.21.11 through 26.2 using only stable Bukkit/Paper API calls.
    compileOnly 'io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

processResources {
    filesMatching('plugin.yml') {
        expand(version: project.version)
    }
}

jar {
    archiveBaseName = 'BiomeGrowth'
}
